participants:
  - el_type: geth
    el_image: ethereum/client-go:latest
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.1.1
    validator_count: 32
    supernode: true
    count: 2
  - el_type: geth
    el_image: ethereum/client-go:latest
    cl_type: lambda
    cl_image: lambda_ethereum_consensus:latest
    use_separate_vc: false
    count: 1
    validator_count: 32
    cl_max_mem: 4096
    keymanager_enabled: true

network_params:
  fulu_fork_epoch: 0
  
additional_services:
  - assertoor
  - tx_fuzz
  - dora

assertoor_params:
 run_stability_check: false
 run_block_proposal_check: false
 tests:
   - https://raw.githubusercontent.com/lambdaclass/lambda_ethereum_consensus/refs/heads/main/.github/config/assertoor/cl-stability-check.yml

tx_fuzz_params:
  tx_fuzz_extra_args: ["--txcount=3", "--accounts=80"]
